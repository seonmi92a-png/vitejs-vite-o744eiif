<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>추이 그래프 | 마중마을힐링캠프</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <div class="brand">
    <span class="dot"></span>
    <span class="name">마중마을힐링캠프</span>
  </div>
  <div class="top">
    <h1>기간별 추이</h1>
    <span class="sub">&nbsp;</span>
  </div>

  <div class="notice" id="notice">불러오는 중…</div>

  <div class="tabs">
    <div class="tab" data-days="30">1개월</div>
    <div class="tab" data-days="90">3개월</div>
    <div class="tab active" data-days="all">전체</div>
  </div>

  <div class="chart-wrap">
    <h2 style="margin-bottom:14px;">날짜별 만실률 (%)</h2>
    <div id="chartSvgWrap"></div>
  </div>

  <div class="card">
    <h2>기간 내 기록</h2>
    <table class="data-table">
      <thead>
        <tr><th>날짜</th><th>예약가능</th><th>예약됨</th><th>만실%</th></tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="4">불러오는 중…</td></tr>
      </tbody>
    </table>
  </div>

</div>

<div class="nav-bottom">
  <a href="index.html"><span class="icon">🏠</span>홈</a>
  <a href="write.html"><span class="icon">✏️</span>기록하기</a>
  <a href="chart.html" class="active"><span class="icon">📈</span>그래프</a>
</div>

<script src="app.js"></script>
<script>
  let allRecords = []; // 최신순 (서버에서 내려주는 순서)

  function filterByPeriod(records, days) {
    if (days === "all" || !records.length) return records;
    const latest = new Date(records[0].date);
    const cutoff = new Date(latest);
    cutoff.setDate(cutoff.getDate() - Number(days));
    return records.filter(function (r) { return new Date(r.date) >= cutoff; });
  }

  function renderTable(recordsDesc) {
    const body = document.getElementById("tableBody");
    if (!recordsDesc.length) {
      body.innerHTML = '<tr><td colspan="4">해당 기간에 기록이 없어요.</td></tr>';
      return;
    }
    body.innerHTML = recordsDesc.map(function (r) {
      return (
        "<tr><td>" + shortDate(r.date) + "</td><td>" + r.available +
        "</td><td>" + r.reserved + '</td><td class="pct">' + r.percent + "%</td></tr>"
      );
    }).join("");
  }

  function renderChart(recordsDesc) {
    const wrap = document.getElementById("chartSvgWrap");
    const records = recordsDesc.slice().reverse(); // 날짜 오름차순으로 그려야 함
    if (records.length === 0) {
      wrap.innerHTML = '<p style="color:var(--ink-soft); font-size:14px; text-align:center; padding:30px 0;">표시할 데이터가 없어요.</p>';
      return;
    }

    const left = 28, right = 306, top = 16, bottom = 140;
    const n = records.length;
    const xAt = function (i) { return n === 1 ? (left + right) / 2 : left + (i * (right - left)) / (n - 1); };
    const yAt = function (pct) { return bottom - (pct / 100) * (bottom - top); };

    const points = records.map(function (r, i) { return xAt(i) + "," + yAt(r.percent); });
    const lineStr = points.join(" ");
    const areaStr = "M" + points.join(" ") + " " + right + "," + bottom + " " + left + "," + bottom + " Z";

    // 라벨은 최대 7개까지만, 많으면 일정 간격으로 골라서 표시
    const maxLabels = 7;
    const step = Math.max(1, Math.ceil(n / maxLabels));

    let svg = '<svg viewBox="0 0 320 170" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">';

    // 그리드
    [0, 25, 50, 75, 100].forEach(function (v) {
      const y = yAt(v);
      svg += '<line x1="' + left + '" y1="' + y + '" x2="' + right + '" y2="' + y +
             '" stroke="' + (v === 0 ? "#6B7280" : "#E7E9EE") + '" stroke-width="1"/>';
      svg += '<text x="2" y="' + (y + 3) + '" font-size="10" fill="#6B7280">' + v + '</text>';
    });

    if (n > 1) {
      svg += '<path d="' + areaStr + '" fill="#2E3192" opacity="0.08"/>';
      svg += '<polyline points="' + lineStr + '" fill="none" stroke="#2E3192" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>';
    }

    records.forEach(function (r, i) {
      const isLast = i === n - 1;
      svg += '<circle cx="' + xAt(i) + '" cy="' + yAt(r.percent) + '" r="' + (isLast ? 4.5 : 3.5) +
             '" fill="#1CA94E"' + (isLast ? ' stroke="#fff" stroke-width="1.5"' : "") + '/>';
      if (i % step === 0 || isLast) {
        svg += '<text x="' + (xAt(i) - 12) + '" y="158" font-size="9.5" fill="#6B7280">' + shortDate(r.date) + '</text>';
      }
    });

    svg += "</svg>";
    wrap.innerHTML = svg;
  }

  function renderPeriod(days) {
    const filtered = filterByPeriod(allRecords, days);
    renderTable(filtered);
    renderChart(filtered);
  }

  document.querySelectorAll(".tab").forEach(function (tab) {
    tab.addEventListener("click", function () {
      document.querySelectorAll(".tab").forEach(function (t) { t.classList.remove("active"); });
      tab.classList.add("active");
      renderPeriod(tab.dataset.days);
    });
  });

  async function init() {
    try {
      allRecords = await fetchRecords();
      document.getElementById("notice").style.display = "none";
      renderPeriod("all");
    } catch (err) {
      document.getElementById("notice").textContent = "데이터를 불러오지 못했어요. 잠시 후 다시 열어봐 주세요.";
    }
  }

  init();
</script>

</body>
</html>
