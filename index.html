<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>예약 현황 | 마중마을힐링캠프</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <div class="brand">
    <span class="dot"></span>
    <span class="name">마중마을힐링캠프</span>
  </div>
  <div class="top">
    <h1>예약 현황</h1>
    <span class="sub" id="loadingSub">불러오는 중…</span>
  </div>

  <!-- 날짜 이동 -->
  <div class="date-nav" id="dateNav" style="display:none;">
    <button id="prevBtn" type="button">◀</button>
    <div class="date-label" id="dateLabel">-</div>
    <button id="nextBtn" type="button">▶</button>
  </div>

  <!-- 선택한 날짜 요약 -->
  <div class="today-card" id="todayCard" style="display:none;">
    <div class="label">만실률</div>

    <div class="ring-wrap">
      <svg viewBox="0 0 120 120">
        <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
        <circle class="ring-fg" id="ringFg" cx="60" cy="60" r="52"
                stroke-dasharray="0 326.7"></circle>
      </svg>
      <div class="ring-center">
        <div class="percent" id="ringPercent">-</div>
        <div class="percent-caption" id="ringCaption">- / -</div>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat-tile"><div class="num" id="statReserved">-</div><div class="label">예약된 사이트</div></div>
      <div class="stat-tile"><div class="num" id="statRemain">-</div><div class="label">남은 사이트</div></div>
      <div class="stat-tile"><div class="num" id="statCheckins">-</div><div class="label">입실 수</div></div>
      <div class="stat-tile"><div class="num" id="statInUse">-</div><div class="label">이용중 수</div></div>
    </div>
  </div>

  <div class="btn-row">
    <a href="write.html" class="btn btn-primary">＋ 새로 기록하기</a>
    <a href="chart.html" class="btn btn-secondary">추이 그래프 보기</a>
  </div>

  <!-- 최근 기록 -->
  <div class="card" style="margin-top:20px;">
    <h2>최근 기록</h2>
    <div id="recentList">
      <div class="list-item"><div class="nums">불러오는 중…</div></div>
    </div>
  </div>

  <div class="notice" id="errorNotice" style="display:none;">
    데이터를 불러오지 못했어요. 잠시 후 다시 열어봐 주세요.
  </div>

</div>

<div class="nav-bottom">
  <a href="index.html" class="active"><span class="icon">🏠</span>홈</a>
  <a href="write.html"><span class="icon">✏️</span>기록하기</a>
  <a href="chart.html"><span class="icon">📈</span>그래프</a>
</div>

<script src="app.js"></script>
<script>
  const RING_CIRCUMFERENCE = 326.7;
  let records = []; // 최신순 (records[0]이 가장 최근 날짜)
  let currentIndex = 0;

  function renderRecord() {
    const record = records[currentIndex];
    if (!record) return;

    document.getElementById("dateLabel").textContent = shortDate(record.date);
    document.getElementById("prevBtn").disabled = currentIndex >= records.length - 1; // 더 오래된 기록 없음
    document.getElementById("nextBtn").disabled = currentIndex <= 0; // 더 최신 기록 없음

    document.getElementById("ringPercent").textContent = record.percent + "%";
    document.getElementById("ringCaption").textContent = record.reserved + " / " + record.available;
    document.getElementById("ringFg").setAttribute(
      "stroke-dasharray",
      (RING_CIRCUMFERENCE * record.percent / 100).toFixed(1) + " " + RING_CIRCUMFERENCE
    );
    document.getElementById("statReserved").textContent = record.reserved;
    document.getElementById("statRemain").textContent = Math.max(record.available - record.reserved, 0);
    document.getElementById("statCheckins").textContent = record.checkins;
    document.getElementById("statInUse").textContent = record.inUse;
  }

  function renderRecentList() {
    const wrap = document.getElementById("recentList");
    if (!records.length) {
      wrap.innerHTML = '<div class="list-item"><div class="nums">아직 기록이 없어요. "새로 기록하기"로 첫 기록을 남겨보세요.</div></div>';
      return;
    }
    wrap.innerHTML = records.slice(0, 7).map(function (r, i) {
      return (
        '<div class="list-item" data-index="' + i + '" style="cursor:pointer;">' +
          '<div class="date">' + shortDate(r.date) + '</div>' +
          '<div class="nums">예약가능 ' + r.available + ' · 예약됨 ' + r.reserved + '</div>' +
          '<div class="pct">' + r.percent + '%</div>' +
        '</div>'
      );
    }).join("");
    wrap.querySelectorAll(".list-item[data-index]").forEach(function (el) {
      el.addEventListener("click", function () {
        currentIndex = Number(el.dataset.index);
        renderRecord();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });
  }

  async function init() {
    try {
      records = await fetchRecords(); // 최신순 정렬됨
      document.getElementById("loadingSub").style.display = "none";

      if (records.length) {
        document.getElementById("dateNav").style.display = "flex";
        document.getElementById("todayCard").style.display = "block";
        renderRecord();
      }
      renderRecentList();
    } catch (err) {
      console.error(err);
      document.getElementById("errorNotice").style.display = "block";
      document.getElementById("loadingSub").textContent = "";
    }
  }

  document.getElementById("prevBtn").addEventListener("click", function () {
    if (currentIndex < records.length - 1) { currentIndex++; renderRecord(); }
  });
  document.getElementById("nextBtn").addEventListener("click", function () {
    if (currentIndex > 0) { currentIndex--; renderRecord(); }
  });

  init();
</script>

</body>
</html>
