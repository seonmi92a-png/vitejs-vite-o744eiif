<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>새 기록 | 마중마을힐링캠프</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <div class="brand">
    <span class="dot"></span>
    <span class="name">마중마을힐링캠프</span>
  </div>
  <div class="top">
    <h1>새로 기록하기</h1>
    <span class="sub">&nbsp;</span>
  </div>

  <div class="notice" id="notice">
    같은 날짜에 다시 저장하면 최신 값으로 덮어써집니다.
  </div>

  <div class="card">

    <div class="field">
      <label>날짜</label>
      <input type="date" id="dateInput">
    </div>

    <div class="field">
      <label>예약가능 사이트 개수</label>
      <input type="number" id="availableInput" min="1">
    </div>

    <div class="field">
      <label>예약된 사이트 개수</label>
      <input type="number" id="reservedInput" min="0">
    </div>

    <div class="result-box">
      <div class="num" id="resultPercent">0%</div>
      <div class="caption">자동 계산된 만실률 (예약됨 ÷ 예약가능)</div>
    </div>

    <button class="btn btn-primary" id="saveBtn" type="button">저장하기</button>

  </div>

  <a href="index.html" class="btn btn-secondary" style="margin-top:8px;">← 홈으로 돌아가기</a>

</div>

<div class="nav-bottom">
  <a href="index.html"><span class="icon">🏠</span>홈</a>
  <a href="write.html" class="active"><span class="icon">✏️</span>기록하기</a>
  <a href="chart.html"><span class="icon">📈</span>그래프</a>
</div>

<script src="app.js"></script>
<script>
  const dateInput = document.getElementById("dateInput");
  const availableInput = document.getElementById("availableInput");
  const reservedInput = document.getElementById("reservedInput");
  const resultPercent = document.getElementById("resultPercent");
  const saveBtn = document.getElementById("saveBtn");
  const notice = document.getElementById("notice");

  // 기본값: 오늘 날짜 / 전체 사이트 개수
  dateInput.value = todayStr();
  availableInput.value = TOTAL_SITES;

  function updatePercent() {
    const available = Number(availableInput.value);
    const reserved = Number(reservedInput.value);
    if (!available || available <= 0 || reserved < 0) {
      resultPercent.textContent = "0%";
      return;
    }
    const pct = Math.round((reserved / available) * 100);
    resultPercent.textContent = pct + "%";
  }

  availableInput.addEventListener("input", updatePercent);
  reservedInput.addEventListener("input", updatePercent);
  updatePercent();

  saveBtn.addEventListener("click", async function () {
    const date = dateInput.value;
    const available = Number(availableInput.value);
    const reserved = Number(reservedInput.value);

    if (!date) { alert("날짜를 선택해 주세요."); return; }
    if (!available || available <= 0) { alert("예약가능 사이트 개수를 입력해 주세요."); return; }
    if (reserved < 0 || reserved > available) { alert("예약된 사이트 개수를 확인해 주세요."); return; }

    saveBtn.disabled = true;
    saveBtn.textContent = "저장 중…";

    try {
      await saveRecord(date, available, reserved);
      notice.textContent = "저장됐어요! 홈 화면으로 이동합니다.";
      notice.style.background = "var(--green-soft)";
      setTimeout(function () { window.location.href = "index.html"; }, 700);
    } catch (err) {
      alert("저장 중 문제가 발생했어요. 다시 시도해 주세요.");
      saveBtn.disabled = false;
      saveBtn.textContent = "저장하기";
    }
  });
</script>

</body>
</html>
